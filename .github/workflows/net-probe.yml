name: net-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 접속 확인 (한전 / 중계 / 온비드)
        env:
          K: ${{ secrets.KEPCO_API_KEY }}
          T: ${{ secrets.VWORLD_PROXY_TOKEN }}
        run: |
          for i in 1 2 3; do
            echo -n "KEPCO $i: "; curl -s -o /dev/null -m 40 -w "%{http_code} %{time_total}s\n" "https://bigdata.kepco.co.kr/openapi/v1/commonCode.do?codeTy=metroCd&apiKey=$K&returnType=json" || echo "curl err $?"
            echo -n "RELAY $i: "; curl -s -o /dev/null -m 40 -H "Accept: application/json" -w "%{http_code} %{time_total}s\n" "https://solarnitice.ivyro.net/vworld.php?token=$T&path=req/data" || echo "curl err $?"
            sleep 5
          done
          echo -n "ONBID: "; curl -s -o /dev/null -m 40 -w "%{http_code} %{time_total}s\n" "https://apis.data.go.kr/B010003/OnbidRlstListSrvc2/getRlstCltrList2" || echo "curl err $?"
          curl -s -m 10 https://api.ipify.org; echo
