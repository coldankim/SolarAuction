name: onbid-alert

on:
  schedule:
    # UTC 기준. 한국시간 08~22시 사이 2시간마다 (KST = UTC+9). 정각은 GitHub 혼잡으로 지연이 커서 17분
    - cron: "17 23,1,3,5,7,9,11,13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 방식"
        type: choice
        default: run
        options: [run, init, test-kakao, dry-run]

permissions:
  contents: write

concurrency:
  group: onbid-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 온비드 조회 + 카톡 알림
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          ONBID_SERVICE_KEY: ${{ secrets.ONBID_SERVICE_KEY }}
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VWORLD_PROXY_TOKEN: ${{ secrets.VWORLD_PROXY_TOKEN }}
          MODE: ${{ inputs.mode || 'run' }}
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
        run: |
          # 토큰 교체를 저장할 수단이 없으면 카카오 토큰을 갱신하기 전에 멈춘다 (새 토큰 유실 방지)
          if [ "$HAS_PAT" != "true" ]; then echo "::error::GH_PAT Secret이 없습니다"; exit 1; fi
          case "$MODE" in
            init)       python onbid_alert.py --init ;;
            test-kakao) python onbid_alert.py --test-kakao ;;
            dry-run)    python onbid_alert.py --dry-run ;;
            *)          python onbid_alert.py ;;
          esac

      # 카카오가 새 refresh_token을 주면 Secret을 교체 (GH_PAT: 이 저장소 Secrets 쓰기 권한만 가진 토큰)
      - name: 카카오 refresh_token Secret 교체
        if: always() && hashFiles('new_refresh_token.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set KAKAO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < new_refresh_token.txt
          rm -f new_refresh_token.txt

      - name: 결과 커밋
        if: always()
        run: |
          rm -f new_refresh_token.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in docs/data.json seen_items.json kepco_cache.json landuse_cache.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
