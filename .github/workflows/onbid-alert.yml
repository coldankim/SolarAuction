name: onbid-alert (비상용, GitHub에서 직접 실행)

# 2026.9.30부터 실제 작업은 아이비호스팅 서버에서 돈다 (server-trigger.yml). 이 워크플로는 비상용(수동 실행만).
# 주의: 서버와 이 워크플로를 동시에 쓰면 기록·카카오 토큰이 어긋난다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 방식"
        type: choice
        default: run
        options: [run, init, test-kakao, dry-run]

permissions:
  contents: write

concurrency:
  group: onbid-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 온비드 조회 + 카톡 알림
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          ONBID_SERVICE_KEY: ${{ secrets.ONBID_SERVICE_KEY }}
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VWORLD_PROXY_TOKEN: ${{ secrets.VWORLD_PROXY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'run' }}
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
        run: |
          # 토큰 교체를 저장할 수단이 없으면 카카오 토큰을 갱신하기 전에 멈춘다 (새 토큰 유실 방지)
          if [ "$HAS_PAT" != "true" ]; then echo "::error::GH_PAT Secret이 없습니다"; exit 1; fi
          case "$MODE" in
            init)       python -u onbid_alert.py --init ;;
            test-kakao) python -u onbid_alert.py --test-kakao ;;
            dry-run)    python -u onbid_alert.py --dry-run ;;
            *)          python -u onbid_alert.py ;;
          esac

      # 카카오가 새 refresh_token을 주면 Secret을 교체 (GH_PAT: 이 저장소 Secrets 쓰기 권한만 가진 토큰)
      - name: 카카오 refresh_token Secret 교체
        if: always() && hashFiles('new_refresh_token.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set KAKAO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < new_refresh_token.txt
          rm -f new_refresh_token.txt

      - name: 결과 커밋
        if: always()
        run: |
          rm -f new_refresh_token.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 원격 최신 커밋 위에 '이번 실행이 만든 결과 파일'만 통째로 올린다.
          # (JSON을 줄 단위로 합치면 기록이 섞이거나 사라질 수 있고, 화면에서 바꾼 settings.json 등은 건드리지 않기 위해)
          FILES="docs/data.json seen_items.json kepco_cache.json landuse_cache.json court_cache.json state.json setback_cache.json"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --mixed origin/main
            for f in $FILES; do [ -f "$f" ] && git add "$f"; done
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -q -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
