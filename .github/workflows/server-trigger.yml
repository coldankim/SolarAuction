name: server-trigger

# 실제 작업은 아이비호스팅 서버(https://solarnitice.ivyro.net)에서 파이썬으로 돈다.
# 호스팅에 예약 실행(cron)이 없어서, 여기서 정해진 시각에 '실행 신호'만 보낸다.
# 호스팅이 해외(GitHub) IP를 가끔 막으므로 1분 간격으로 재시도한다.
on:
  schedule:
    # UTC 기준. 한국시간 08~22시 사이 2시간마다 (정각은 GitHub 혼잡으로 지연이 커서 17분)
    - cron: "17 23,1,3,5,7,9,11,13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 방식"
        type: choice
        default: run
        options: [run, test, dry, init]

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 서버에 실행 신호
        env:
          T: ${{ secrets.TRIGGER_TOKEN }}
          MODE: ${{ inputs.mode || 'run' }}
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            r=$(curl -s -m 30 -H "Accept: */*" -H "User-Agent: Mozilla/5.0" "https://solarnitice.ivyro.net/trigger.php?token=$T&mode=$MODE" || true)
            if echo "$r" | grep -q '"ok":true'; then echo "신호 전달: $r"; exit 0; fi
            echo "시도 $i 실패, 60초 뒤 재시도"
            sleep 60
          done
          echo "::error::서버에 실행 신호를 보내지 못했습니다"
          exit 1
