name: relay-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 중계 서버 요청 간격별 측정
        env:
          T: ${{ secrets.VWORLD_PROXY_TOKEN }}
          K: ${{ secrets.KEPCO_API_KEY }}
        run: |
          curl -s -m 10 https://api.ipify.org; echo
          set +e
          for gap in 20; do
          ok=0; bad=0
          echo "== gap $gap s"
          for i in $(seq 1 12); do
            r=$(curl -s -o /dev/null -m 15 -H "Accept: */*" -w "%{http_code}" "https://solarnitice.ivyro.net/vworld.php?host=kepco&path=openapi/v1/commonCode.do&token=$T&codeTy=metroCd&apiKey=$K&returnType=json" 2>&1)
            echo "$i $(date +%T) $r"
            [ "$r" = "200" ] && ok=$((ok+1)) || bad=$((bad+1))
            sleep $gap
          done
          echo "gap=$gap OK=$ok BAD=$bad"
          sleep 60
          done
