name: relay-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 중계 서버 연속 요청 측정 (1초 간격 40회)
        env:
          T: ${{ secrets.VWORLD_PROXY_TOKEN }}
          K: ${{ secrets.KEPCO_API_KEY }}
        run: |
          curl -s -m 10 https://api.ipify.org; echo
          ok=0; bad=0
          for i in $(seq 1 40); do
            r=$(curl -s -o /dev/null -m 20 -H "Accept: */*" -w "%{http_code}" "https://solarnitice.ivyro.net/vworld.php?host=kepco&path=openapi/v1/commonCode.do&token=$T&codeTy=metroCd&apiKey=$K&returnType=json" 2>&1)
            echo "$i $(date +%T) $r"
            [ "$r" = "200" ] && ok=$((ok+1)) || bad=$((bad+1))
            sleep 1
          done
          echo "OK=$ok BAD=$bad"
