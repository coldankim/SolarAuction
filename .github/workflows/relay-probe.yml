name: relay-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 중계 경유 브이월드 조회
        env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VWORLD_PROXY_TOKEN: ${{ secrets.VWORLD_PROXY_TOKEN }}
        run: |
          python - <<'PY'
          import os, landuse
          lu = landuse.Landuse(os.environ["VWORLD_API_KEY"], "coldankim.github.io",
                               "https://solarnitice.ivyro.net/vworld.php", os.environ["VWORLD_PROXY_TOKEN"])
          lu.cache = {}
          print("zones:", landuse.screen(lu.zones("4159132031100740040"))["label"])
          print("search:", lu.pnu_by_address("경기도 화성시 만세구 서신면 백미리 79"))
          PY
